<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title"><title id="title">留学費用は、3つに分けて考える</title><rect width="720" height="420" rx="24" fill="#edf4fb"/><g font-family="sans-serif" fill="#173b68"><text x="36" y="52" font-size="28" font-weight="bold">留学費用は、3つに分けて考える</text><rect x="28" y="80" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="122" r="23" fill="#f5bd45"/><text x="65" y="130" font-size="24" text-anchor="middle" font-weight="bold">1</text><text x="106" y="113" font-size="24" font-weight="bold">毎月の暮らし</text><text x="106" y="144" font-size="21">家賃・食費・保険・通信・交通</text><rect x="28" y="180" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="222" r="23" fill="#f5bd45"/><text x="65" y="230" font-size="24" text-anchor="middle" font-weight="bold">2</text><text x="106" y="213" font-size="24" font-weight="bold">大学に納めるお金</text><text x="106" y="244" font-size="21">授業料と、学期ごとの納付金</text><rect x="28" y="280" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="322" r="23" fill="#f5bd45"/><text x="65" y="330" font-size="24" text-anchor="middle" font-weight="bold">3</text><text x="106" y="313" font-size="24" font-weight="bold">渡航前後に必要なお金</text><text x="106" y="344" font-size="21">航空券・敷金・仮住まい・家具</text></g></svg>