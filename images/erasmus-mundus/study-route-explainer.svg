<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">エラスムス・ムンドゥス：複数の大学で学ぶ仕組み</title><desc id="desc">1年目に国Aの大学、2年目に国Bの大学で学び、課程の規定に従い共同学位または複数学位を取得するイメージ図</desc><rect width="1200" height="610" fill="#f8fafc"/><rect x="28" y="24" width="1144" height="562" rx="26" fill="#fff" stroke="#dbe6f0" stroke-width="2"/><text x="65" y="90" font-family="sans-serif" font-size="36" font-weight="700" fill="#12365a">2か国以上の大学で学ぶって、どういうこと？</text><text x="65" y="129" font-family="sans-serif" font-size="20" fill="#42566a">1つの修士課程に入学し、学期や年度ごとに学ぶ国・大学を移動する仕組みです。</text><g font-family="sans-serif"><rect x="65" y="175" width="315" height="285" rx="20" fill="#e7f2fc"/><rect x="442" y="175" width="315" height="285" rx="20" fill="#eaf5ee"/><rect x="819" y="175" width="315" height="285" rx="20" fill="#fff3e7"/><text x="90" y="221" font-size="23" font-weight="700" fill="#143b60">1年目｜大学A</text><text x="467" y="221" font-size="23" font-weight="700" fill="#20553a">2年目｜大学B</text><text x="844" y="221" font-size="23" font-weight="700" fill="#754318">修了｜学位取得</text><g stroke-width="3"><path d="M115 352V282L222 239L328 282V352" fill="#c7dff3" stroke="#527ca0"/><path d="M492 352V282L600 239L707 282V352" fill="#c9e5d5" stroke="#639478"/><path d="M866 340L980 274L1088 340V392H866Z" fill="#f4d6ac" stroke="#a87946"/></g><g fill="#fff"><rect x="147" y="293" width="38" height="59"/><rect x="203" y="293" width="38" height="59"/><rect x="259" y="293" width="38" height="59"/><rect x="524" y="293" width="38" height="59"/><rect x="580" y="293" width="38" height="59"/><rect x="636" y="293" width="38" height="59"/><rect x="950" y="332" width="65" height="60"/></g><g font-size="20" fill="#28394a"><text x="90" y="403">例：ハンガリー</text><text x="467" y="403">例：フランス</text><text x="844" y="422">共同学位・複数学位など</text></g><path d="M389 320h42m-14-14 14 14-14 14M766 320h42m-14-14 14 14-14 14" stroke="#507aa4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="491" width="1069" height="63" rx="13" fill="#f0f5fb"/><text x="85" y="518" font-size="18" fill="#284764">※図は仕組みを説明する架空の例。実際の国・大学・移動時期・学位の種類は課程によって異なります。</text><text x="85" y="543" font-size="17" fill="#284764">奨学金採用者には月額1,400ユーロの支援。全ての入学者が受給できるわけではありません。</text></g></svg>