<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" rx="24" fill="#f5f8fc"/><text x="40" y="62" font-family="sans-serif" font-size="28" fill="#183c33" font-weight="bold">表示価格を、買う量に合わせて考える</text><rect x="40" y="90" width="405" height="190" rx="18" fill="#e8f2ea"/><text x="65" y="135" font-family="sans-serif" font-size="24" fill="#254b38">鶏胸肉：1 kgの価格 × 0.5</text><text x="65" y="181" font-family="sans-serif" font-size="21" fill="#486154">500 gを買う場合の目安</text><text x="65" y="239" font-family="sans-serif" font-size="19" fill="#486154">重量に比例させて試算できます</text><rect x="470" y="90" width="450" height="190" rx="18" fill="#f6ecdb"/><text x="495" y="135" font-family="sans-serif" font-size="24" fill="#614d2e">パスタ：400–500 gで1単位</text><text x="495" y="181" font-family="sans-serif" font-size="21" fill="#614d2e">1 kgの価格と取り違えない</text><text x="495" y="239" font-family="sans-serif" font-size="19" fill="#614d2e">容量に幅のある統計品目に注意</text></svg>