name: Update Germany note articles
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public note posts
        run: python scripts/update_germany_note.py
      - name: Commit changed article data
        run: |
          if ! git diff --quiet -- germany/data/note-posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add germany/data/note-posts.json
            git commit -m "Update Germany note article listings"
            git push
          fi
