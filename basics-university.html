<!doctype html>
<html lang="ja">
<head>

  <title>大学の探し方｜ハンガリー現役大学生に直接聞けるオンライン留学相談</title>

</head>

<body>
  <div class="container">
    <header class="section">
      <h1 style="text-align:center;">大学の探し方</h1>
      <p class="muted" style="text-align:center;">
        自分に合う大学・専攻をどうやって選ぶかを整理します。
      </p>
    </header>

    <section class="section card simpleCard">
      <h2>大学の種類</h2>
      <p>
        ハンガリーには総合大学、医学系大学、芸術系大学など
        さまざまなタイプの大学があります。
      </p>
    </section>

    <section class="section card simpleCard">
      <h2>専攻の選び方</h2>
      <p>
        名前が似ていても中身が違う専攻も多く、
        カリキュラムの確認が重要になります。
      </p>
    </section>

    <section class="section card simpleCard">
      <h2>公式サイトの見方・注意点</h2>
      <p>
        出願条件、英語要件、締切などは公式サイトに書かれていますが、
        分かりづらい部分も多いのが実情です。
      </p>
    </section>

    <div class="section" style="text-align:center;">
      <a class="btn primary" href="index.html#search">現役生を探す</a>
    </div>

    <footer class="footer">
