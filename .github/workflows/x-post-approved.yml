name: X approved post

on:
  workflow_dispatch:
    inputs:
      post_text:
        description: "確認済みの投稿文を入力してください"
        required: true
        type: string
      approved:
        description: "投稿文を確認し、今すぐXへ投稿する場合だけチェック"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  post:
    if: ${{ inputs.approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish approved post to X
        env:
          POST_TEXT: ${{ inputs.post_text }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          text = os.environ.get("POST_TEXT", "").strip()
          token = os.environ.get("X_USER_ACCESS_TOKEN", "")
          if not text:
              sys.exit("投稿文が空です。")
          if not token:
              sys.exit("GitHub SecretsにX_USER_ACCESS_TOKENが登録されていません。")

          response = requests.post(
              "https://api.x.com/2/tweets",
              headers={"Authorization": f"Bearer {token}"},
              json={"text": text},
              timeout=30,
          )
          if not response.ok:
              print(f"X API error ({response.status_code}): {response.text}")
              response.raise_for_status()

          post_id = response.json()["data"]["id"]
          print("投稿しました: https://x.com/i/status/" + post_id)
          PY
