name: Update verified university rankings
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-university-rankings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test edition-aware parsers and preservation
        run: python -m unittest discover -s tests -p 'test_university_rankings.py'
      - name: Refresh official rankings including new editions and rebuild both pages
        run: python scripts/refresh_university_rankings.py
      - name: Verify generated pages
        run: python scripts/build_university_rankings.py --check
      - name: Commit consistent ranking dataset and pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add university-rankings-data.json basics-university.html guide-university-ranking.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified university ranking data and comparison pages'
            git push
          fi
