<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title"><title id="title">奨学金を探すときの3つの確認</title><rect width="720" height="420" rx="24" fill="#edf4fb"/><g font-family="sans-serif" fill="#173b68"><text x="36" y="52" font-size="28" font-weight="bold">奨学金を探すときの3つの確認</text><rect x="28" y="80" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="122" r="23" fill="#f5bd45"/><text x="65" y="130" font-size="24" text-anchor="middle" font-weight="bold">1</text><text x="106" y="113" font-size="24" font-weight="bold">誰が応募できる？</text><text x="106" y="144" font-size="21">高校生・大学生・大学卒業者など</text><rect x="28" y="180" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="222" r="23" fill="#f5bd45"/><text x="65" y="230" font-size="24" text-anchor="middle" font-weight="bold">2</text><text x="106" y="213" font-size="24" font-weight="bold">何に使える？</text><text x="106" y="244" font-size="21">生活費・授業料・渡航費の支援範囲</text><rect x="28" y="280" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="322" r="23" fill="#f5bd45"/><text x="65" y="330" font-size="24" text-anchor="middle" font-weight="bold">3</text><text x="106" y="313" font-size="24" font-weight="bold">いつまでに準備する？</text><text x="106" y="344" font-size="21">募集の締切・書類・大学への出願</text></g></svg>