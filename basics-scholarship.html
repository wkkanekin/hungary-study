    <section class="section">
      <div class="card simpleCard">
        <pre style="white-space:pre-wrap;margin:0;font-weight:850;line-height:1.85;">奨学金について（概要）
・ハンガリー政府奨学金 Stipendium Hungaricum は学費免除＋生活費補助などがある
・学士/修士/博士などが対象（専攻・大学により条件あり）
・応募時期は年度により変動（例：秋〜冬に募集開始が多い）
・必要書類は一般に：成績証明、卒業証明、語学証明、推薦状など
・合否後に健康診断・ビザ等の手続きが必要になる場合がある
</pre>
      </div>
    </section>
