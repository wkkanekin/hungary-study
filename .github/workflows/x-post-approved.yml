name: X approved post

on:
  push:
    branches: [main]
    paths:
      - 'social/approved/*.json'
  workflow_dispatch:
    inputs:
      check_only:
        description: "接続確認だけ実行（Xには公開しません）"
        required: true
        default: true
        type: boolean
      post_text:
        description: "確認済みの投稿文"
        required: false
        type: string
      image_url:
        description: "画像のHTTPS URL（任意）"
        required: false
        type: string
      approved:
        description: "本文と画像を確認し、今すぐXへ投稿する場合だけチェック"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: x-approved-publishing
  cancel-in-progress: false

jobs:
  post:
    if: ${{ github.event_name == 'push' || inputs.check_only == true || inputs.approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: |
          python -m pip install requests==2.32.5
      - name: Load approved post on push
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=A', os.environ['BEFORE_SHA'], os.environ['AFTER_SHA']],
              text=True).splitlines()
          candidates = [p for p in changed if p.startswith('social/approved/') and p.endswith('.json')]
          if len(candidates) != 1:
              sys.exit('One newly approved JSON file per commit is required.')
          with open(candidates[0], encoding='utf-8') as f:
              post = json.load(f)
          if post.get('approved') is not True:
              sys.exit('Approval is missing.')
          if not post.get('text', '').strip() or not post.get('image_url', '').startswith('https://'):
              sys.exit('Text and licensed HTTPS image URL are required. No post was published.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key, value in [('POST_TEXT', post['text']), ('IMAGE_URL', post.get('image_url', '')), ('APPROVED_FILE', candidates[0]), ('CHECK_ONLY', 'false')]:
                  delimiter = 'EOF_SOCIAL_' + key
                  out.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          PY
      - name: Publish approved post to X
        env:
          CHECK_ONLY: ${{ github.event_name == 'push' && 'false' || inputs.check_only }}
          POST_TEXT_INPUT: ${{ inputs.post_text }}
          IMAGE_URL_INPUT: ${{ inputs.image_url }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import base64
          import os
          import sys
          from urllib.parse import urlparse
          import requests

          def checked(response, label):
              if not response.ok:
                  sys.exit(f"{label}: HTTP {response.status_code}; details: {response.text[:800]}")
              return response.json()

          text = (os.environ.get("POST_TEXT") or os.environ.get("POST_TEXT_INPUT") or "").strip()
          check_only = os.environ.get("CHECK_ONLY") == "true"
          if not text and not check_only:
              sys.exit("投稿文が空です。")
          names = ["X_ACCESS_TOKEN", "X_ACCESS_TOKEN_SECRET",
                   "X_OAUTH2_CLIENT_ID", "X_OAUTH2_CLIENT_SECRET"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              sys.exit("GitHub Secretsに追加してください: " + ", ".join(missing))

          image_url = (os.environ.get("IMAGE_URL") or os.environ.get("IMAGE_URL_INPUT") or "").strip()
          image_data = None
          if image_url and not check_only:
              parsed = urlparse(image_url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  sys.exit("画像にはHTTPS URLを指定してください。")
              with requests.get(image_url, timeout=30, stream=True, allow_redirects=True,
                                headers={"User-Agent": "HungaryStudyLabSocial/1.0 (https://hungarystudy.org/; contact via website)",
                                         "Accept": "image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8"}) as response:
                  if response.status_code != 200:
                      sys.exit(f"画像取得失敗: HTTP {response.status_code} URL={response.url}")
                  if response.headers.get("Content-Type", "").split(";")[0].lower() not in [
                      "image/jpeg", "image/png", "image/webp", "image/gif"
                  ]:
                      sys.exit("画像URLはJPEG・PNG・WEBP・GIFファイルを指定してください。")
                  data = bytearray()
                  for chunk in response.iter_content(65536):
                      data.extend(chunk)
                      if len(data) > 5 * 1024 * 1024:
                          sys.exit("画像は5MB以下にしてください。")
                  if not data:
                      sys.exit("画像が空です。")
                  image_data = bytes(data)

          token_result = checked(requests.post(
              "https://api.x.com/2/oauth2/token",
              auth=(os.environ["X_OAUTH2_CLIENT_ID"], os.environ["X_OAUTH2_CLIENT_SECRET"]),
              data={
                  "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                  "subject_token": os.environ["X_ACCESS_TOKEN"],
                  "subject_token_type": "urn:x:params:oauth:token-type:oauth1_token",
                  "oauth_token_secret": os.environ["X_ACCESS_TOKEN_SECRET"],
              }, timeout=30
          ), "認証")
          token = token_result["access_token"]
          print("::add-mask::" + token)
          headers = {"Authorization": "Bearer " + token}
          if check_only:
              scopes = set(token_result.get("scope", "").split())
              required = {"tweet.write", "media.write"}
              if not required.issubset(scopes):
                  sys.exit("認証成功。ただし投稿・画像の権限不足: " + ", ".join(sorted(required - scopes)))
              print("接続確認成功: 認証と投稿・画像の権限を確認しました。Xには公開していません。")
              sys.exit(0)
          payload = {"text": text}
          if image_data is not None:
              from mimetypes import guess_type
              media_type = guess_type(urlparse(image_url).path)[0] or "image/jpeg"
              if media_type not in ("image/jpeg", "image/png", "image/webp", "image/gif"):
                  sys.exit("画像形式が未対応です。")
              base = "https://api.x.com/2/media/upload"
              initiated = checked(requests.post(
                  base + "/initialize", headers=headers,
                  json={"media_type": media_type, "total_bytes": len(image_data),
                        "media_category": "tweet_image"}, timeout=30,
              ), "画像アップロード開始")
              media_id = initiated["data"]["id"]
              for i in range(0, len(image_data), 4 * 1024 * 1024):
                  response = requests.post(
                      base + "/" + str(media_id) + "/append",
                      headers=headers,
                      data={"segment_index": i // (4 * 1024 * 1024)},
                      files={"media": ("image", image_data[i:i + 4 * 1024 * 1024], media_type)},
                      timeout=60,
                  )
                  if not response.ok:
                      sys.exit(f"画像転送: HTTP {response.status_code}")
              finalized = checked(requests.post(
                  base + "/" + str(media_id) + "/finalize",
                  headers=headers, timeout=30,
              ), "画像アップロード確定")
              if finalized.get("data", {}).get("processing_info", {}).get("state") in ("pending", "in_progress"):
                  sys.exit("画像処理が未完了のため投稿を中止しました。")
              payload["media"] = {"media_ids": [str(media_id)]}

          result = checked(requests.post(
              "https://api.x.com/2/tweets",
              headers=headers, json=payload, timeout=30,
          ), "投稿")
          print("投稿しました: https://x.com/i/status/" + result["data"]["id"])
          PY
