name: X approved post

on:
  workflow_dispatch:
    inputs:
      post_text:
        description: "確認済みの投稿文を入力してください"
        required: true
        type: string
      approved:
        description: "投稿文を確認し、今すぐXへ投稿する場合だけチェック"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  post:
    if: ${{ inputs.approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OAuth signing library
        run: python -m pip install requests-oauthlib==2.0.0

      - name: Publish approved post to X
        env:
          POST_TEXT: ${{ inputs.post_text }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from requests_oauthlib import OAuth1

          text = os.environ.get("POST_TEXT", "").strip()
          if not text:
              sys.exit("投稿文が空です。")
          required = (
              "X_API_KEY",
              "X_API_SECRET",
              "X_ACCESS_TOKEN",
              "X_ACCESS_TOKEN_SECRET",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit("GitHub Secretsが不足しています: " + ", ".join(missing))

          auth = OAuth1(
              os.environ["X_API_KEY"],
              os.environ["X_API_SECRET"],
              os.environ["X_ACCESS_TOKEN"],
              os.environ["X_ACCESS_TOKEN_SECRET"],
          )
          response = requests.post(
              "https://api.x.com/2/tweets",
              auth=auth,
              json={"text": text},
              timeout=30,
          )
          if not response.ok:
              # 応答本文だけを表示し、認証情報は出力しません。
              print(f"X API error ({response.status_code}): {response.text}")
              response.raise_for_status()

          post_id = response.json()["data"]["id"]
          print("投稿しました: https://x.com/i/status/" + post_id)
          PY

      - name: Explain skipped post
        if: ${{ inputs.approved != true }}
        run: echo "承認チェックがないため、Xへの投稿は行いませんでした。"
