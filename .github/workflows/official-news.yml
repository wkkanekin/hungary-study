name: Official news and website

on:
  schedule:
    # Every day at 05:17 UTC (Budapest 07:17 summer / 06:17 winter).
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-news-and-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.collect.outcome == 'success' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/official-news-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_official_news.py'
      - name: Collect official news
        id: collect
        continue-on-error: true
        run: python scripts/official_news.py
      - name: Record changes
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-news.json scripts/official-news-state.json scripts/official-news-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official study news"
            git push origin HEAD:main
          fi
      - name: Prepare public website
        if: steps.collect.outcome == 'success' || github.event_name == 'push'
        run: |
          mkdir -p /tmp/hungary-public-site
          rsync -a ./ /tmp/hungary-public-site/ --exclude=.git --exclude=.github --exclude=scripts --exclude=tests --exclude=__pycache__ --exclude='*.py' --exclude='requirements*.txt' --exclude='*README*' --exclude='official-news-sources.json'
          touch /tmp/hungary-public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outcome == 'success' || github.event_name == 'push'
        with:
          path: /tmp/hungary-public-site
      - name: Collection summary
        if: always()
        run: |
          echo '### Official news check' >> "$GITHUB_STEP_SUMMARY"
          if [ -f scripts/official-news-status.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat scripts/official-news-status.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo 'Official sources could not be checked. Existing news is retained.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
