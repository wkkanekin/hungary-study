<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ハンガリー vs 日本｜物価比較</title>

  <meta
    name="description"
    content="ハンガリー主要都市と日本主要都市の生活費・家賃・外食価格を比較します。ブダペスト、ペーチ、デブレツェン、セゲドなどのコスト感をわかりやすく整理しています。"
  />

  <link rel="stylesheet" href="guide-article.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="container">
    <header class="topBar card">
      <div class="topBarInner">
        <a class="topLink" href="index.html">TOP</a>
        <span class="topSep">/</span>
        <a class="topLink" href="guide.html">Guide</a>
        <span class="topSep">/</span>
        <span class="topCurrent">物価比較</span>
      </div>
    </header>

    <article class="articleShell">
      <header class="articleHero card">
        <div class="articleHeroInner">
          <div class="articleMetaTop">
            <span class="chip">費用</span>
            <span class="metaDot">•</span>
            <time datetime="2026-04-12">2026-04-12</time>
          </div>

          <h1 class="articleTitle">
            ハンガリー vs 日本｜主要都市の物価比較
          </h1>

          <p class="articleLead">
            ハンガリーの主要都市と日本の主要都市を、
            生活費・家賃・外食価格の3つで比較します。
          </p>
        </div>
      </header>

      <div class="articleLayout">
        <main class="articleMain card">
          <div class="articleBody">

            <section>
              <h2>データの更新状況</h2>
              <p id="metaText">読み込み中…</p>
            </section>

            <section>
              <h2>生活費（New York = 100）</h2>
              <canvas id="costChart"></canvas>
            </section>

            <section>
              <h2>家賃（New York = 100）</h2>
              <canvas id="rentChart"></canvas>
            </section>

            <section>
              <h2>外食（New York = 100）</h2>
              <canvas id="restaurantChart"></canvas>
            </section>

            <section>
              <h2>一覧表</h2>
              <table>
                <thead>
                  <tr>
                    <th>都市</th>
                    <th>生活費</th>
                    <th>家賃</th>
                    <th>外食</th>
                  </tr>
                </thead>
                <tbody id="compareTableBody">
                  <tr>
                    <td colspan="4">読み込み中…</td>
                  </tr>
                </tbody>
              </table>
            </section>

          </div>
        </main>
      </div>
    </article>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const metaText = document.getElementById("metaText");
      const tableBody = document.getElementById("compareTableBody");

      function formatNumber(value) {
        if (typeof value !== "number") return "—";
        return value.toFixed(1);
      }

      function createChart(id, labels, data) {
        new Chart(document.getElementById(id), {
          type: "bar",
          data: {
            labels,
            datasets: [{ data }]
          },
          options: {
            indexAxis: "y",
            plugins: { legend: { display: false } },
            scales: {
              x: { beginAtZero: true }
            }
          }
        });
      }

      try {
        const res = await fetch("cost_compare_numbeo.json");
        const json = await res.json();

        const cities = json.cities;

        metaText.textContent = "最終更新：" + json.updated_at;

        const labels = [];
        const cost = [];
        const rent = [];
        const food = [];

        cities.forEach(c => {
          labels.push(c.label_ja);
          cost.push(c.cost_of_living_index);
          rent.push(c.rent_index);
          food.push(c.restaurant_price_index);

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${c.label_ja}</td>
            <td>${formatNumber(c.cost_of_living_index)}</td>
            <td>${formatNumber(c.rent_index)}</td>
            <td>${formatNumber(c.restaurant_price_index)}</td>
          `;
          tableBody.appendChild(tr);
        });

        createChart("costChart", labels, cost);
        createChart("rentChart", labels, rent);
        createChart("restaurantChart", labels, food);

      } catch (e) {
        metaText.textContent = "データ取得失敗";
      }
    });
  </script>
</body>
</html>
