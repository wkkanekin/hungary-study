<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ハンガリー留学相談</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Leaflet CSS（地図の白枠/タイル表示に必須） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>
  <div class="container">

    <!-- Hero（ダミー） -->
    <header class="heroHeader card">
      <div class="heroBg"></div>
      <div class="headerRow">
        <div class="logoBox">LOGO</div>
        <div class="headerText">
          <h1 class="headerTitle">ハンガリー留学相談</h1>
          <p class="headerSub">現地の現役生と、40分で不安を整理する</p>
        </div>
      </div>
    </header>

    <!-- Mini TOC（最低限） -->
    <div class="miniToc">
      <button id="tocToggle" class="tocBtn" aria-expanded="false" type="button">目次</button>
      <div id="tocPanel" class="tocPanel">
        <a href="#map">地図から探す</a>
        <a href="#students">現役生一覧</a>
        <a href="#contact">お問い合わせ</a>
      </div>
    </div>

    <!-- 地図 -->
    <section id="map" class="section">
      <h2>地図から探す</h2>

      <div class="mapLayout">
        <!-- 左：地図カード -->
        <div class="mapCard">
          <div id="huMap" class="huMap"></div>

          <div class="mapBar">
            <div class="mapLeft">
              <span id="mapStatus" class="mapStatus">読み込み中…</span>
              <span class="muted">クリックで都市を選択</span>
            </div>
            <div class="mapRight">
              <button id="clearUniFilter" class="btn" type="button" style="display:none;">検索条件をクリア</button>
              <button id="applyMapSearch" class="btn primary" type="button">検索する</button>
            </div>
          </div>
        </div>

        <!-- 右：大学一覧 -->
        <div class="card mapResults">
          <p class="mapResultsTitle">大学一覧</p>
          <p id="mapHint" class="mapHint">地図の都市をクリックすると、大学一覧が表示されます。</p>

          <div class="mapPicked">
            <span class="muted">選択中：</span><span id="pickedUni" class="pickedUni">未選択</span>
          </div>

          <div id="uniList" class="uniList"></div>
        </div>
      </div>
    </section>

    <!-- 現役生 -->
    <section id="students" class="section">
      <h2>現役生一覧</h2>
      <p id="studentListTitle" class="muted" style="text-align:center;margin:0 0 10px;">今月の注目現役生（最大2名）</p>

      <div id="studentList" class="studentList"></div>

      <div id="noResults" class="card emptyCard" style="display:none;">
        <p class="emptyTitle">該当する現役生が見つかりませんでした</p>
        <p class="emptyText">検索条件を変えてお試しください。</p>
      </div>
    </section>

    <!-- お問い合わせ -->
    <section id="contact" class="section">
      <h2>お問い合わせ</h2>
      <div id="contactGrid" class="contactGrid contactGridOne"></div>
    </section>

    <!-- SNS -->
    <section id="social" class="section">
      <h2>SNS</h2>
      <div id="socialGrid" class="contactGrid"></div>
    </section>

    <footer class="footer">ハンガリー留学相談</footer>
  </div>

  <!-- Leaflet JS（script.js より先に必須） -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- あなたのJS -->
  <script src="./script.js"></script>
</body>
</html>
