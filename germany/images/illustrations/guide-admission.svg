<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title"><title id="title">大学出願では、3つを別々に確認</title><rect width="720" height="420" rx="24" fill="#edf4fb"/><g font-family="sans-serif" fill="#173b68"><text x="36" y="52" font-size="28" font-weight="bold">大学出願では、3つを別々に確認</text><rect x="28" y="80" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="122" r="23" fill="#f5bd45"/><text x="65" y="130" font-size="24" text-anchor="middle" font-weight="bold">1</text><text x="106" y="113" font-size="24" font-weight="bold">学歴の条件</text><text x="106" y="144" font-size="21">高校の卒業・共通テスト・大学での学習歴</text><rect x="28" y="180" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="222" r="23" fill="#f5bd45"/><text x="65" y="230" font-size="24" text-anchor="middle" font-weight="bold">2</text><text x="106" y="213" font-size="24" font-weight="bold">授業を受ける語学力</text><text x="106" y="244" font-size="21">ドイツ語／英語の試験・必要な点数</text><rect x="28" y="280" width="664" height="86" rx="16" fill="white"/><circle cx="65" cy="322" r="23" fill="#f5bd45"/><text x="65" y="330" font-size="24" text-anchor="middle" font-weight="bold">3</text><text x="106" y="313" font-size="24" font-weight="bold">志望する課程の選考</text><text x="106" y="344" font-size="21">成績・作品・面接など、課程ごとの条件</text></g></svg>