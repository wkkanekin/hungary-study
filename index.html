<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ハンガリー現役大学生相談サービス（β）</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">HU</div>
      <div>
        <h1>ハンガリー現役大学生相談サービス（β）</h1>
        <p class="sub">
          現役ハンガリー大学生と1対1で、<br />
          留学や進学、現地生活のリアルを相談できるオンラインサービス
        </p>
        <p class="fineprint">
          ※β期間中は、まずは気軽に相談してもらうためのテスト運用です。
        </p>
      </div>
    </div>
  </header>

  <main>
    <!-- SEARCH -->
    <section class="section" id="search">
      <h2>現役大学生一覧・検索</h2>
      <div class="search-grid">
        <input
          type="text"
          id="keyword"
          placeholder="大学名・地域・キーワードで検索"
        />
        <select id="regionFilter">
          <option value="">地域指定なし</option>
          <option value="ブダペスト">ブダペスト</option>
          <option value="セゲド">セゲド</option>
        </select>
        <select id="courseFilter">
          <option value="">分野指定なし</option>
          <option value="経営">経営</option>
          <option value="社会系">社会系</option>
          <option value="医学部">医学部</option>
        </select>
      </div>
    </section>

    <!-- STUDENTS -->
    <section class="section" id="students">
      <h2>現役生（順次追加予定）</h2>

      <!-- ★ ここが重要：JSが自動生成する -->
      <div class="student-list" id="studentList">
        <!-- students.json から自動生成 -->
      </div>
    </section>

    <!-- QUESTION TEMPLATE -->
    <textarea id="questionTemplate" class="sr-only">
【大学・学業について】
・大学全体の雰囲気や授業について
・試験や課題の負荷
    </textarea>
  </main>

  <footer class="site-footer">
    <p>© 2026 Hungary Study 現役生相談サービス（β）</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
